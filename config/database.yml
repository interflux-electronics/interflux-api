# Documentation:
# http://guides.rubyonrails.org/configuring.html#configuring-a-database
# http://guides.rubyonrails.org/configuring.html#database-pooling
# https://www.digitalocean.com/community/tutorials/how-to-deploy-a-rails-app-with-puma-and-nginx-on-ubuntu-14-04

default: &default
  adapter: postgresql
  encoding: unicode
  host: localhost
  port: 5432
  pool: 5

production:
  <<: *default
  database: interflux_production
  username: <%= Rails.application.credentials.dig(:postgres, :user) %>
  password: <%= Rails.application.credentials.dig(:postgres, :pass) %>

development:
  <<: *default
  database: interflux_development

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
#
# PG_* host/port/database stay as ENV so GitHub CI can override connection metadata.
# Postgres user/pass come from Rails credentials (see config/credentials/credentials.template.yml).
#
test:
  <<: *default
  database: <%= ENV.fetch('PG_DATABASE', 'interflux_test') %>
  host:     <%= ENV.fetch('PG_HOST', 'localhost') %>
  port:     <%= ENV.fetch('PG_PORT', 5432) %>
  username: <%= Rails.application.credentials.dig(:postgres, :user) %>
  password: <%= Rails.application.credentials.dig(:postgres, :pass) %>
